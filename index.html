<body>
<canvas id="art"></canvas>
<div class="scrim" id="scrim"></div>

<div class="top"><div class="top-in">
  <span class="brand">Ti OS</span>
  <span class="tools">
    <button class="ui-btn" id="uiBtn" aria-pressed="true">Интерфейс</button>
    <button class="rnd" id="fsBtn" aria-label="Во весь экран" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
    <button class="rnd" id="gear" aria-label="Оформление">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </span>
</div></div>

<main class="app" id="app"></main>

<div class="dock" id="dock"><div class="dock-in">
  <div class="acts">
    <button class="act minus" id="bExp"><span class="sgn">−</span>Расход</button>
    <button class="act plus" id="bInc"><span class="sgn">+</span>Приход</button>
  </div>
  <div class="tabs">
    <button data-go="budget" aria-current="page">Бюджет</button>
    <button data-go="goals">Цели</button>
    <button data-go="history">История</button>
    <button data-go="more">Ещё</button>
  </div>

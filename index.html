<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ti OS">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Ti OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
<style>
/* Layout: генеративное полотно во весь экран, поверх — приложение в одном из двух оформлений.
   Осознанно один тёмный мир: светлой версии нет. */
:root{
  --void:#05070e; --ink:#f2f6ff;
  --l86:rgba(242,246,255,.86); --l70:rgba(242,246,255,.70);
  --l50:rgba(242,246,255,.50); --l20:rgba(242,246,255,.20);
  --l11:rgba(242,246,255,.11); --l06:rgba(242,246,255,.06);
  --c1:#fff; --c2:#fff; --c3:#fff; --c4:#fff; --c5:#fff; --c6:#fff;
  --pos:#fff; --neg:rgba(242,246,255,.62); --gol:rgba(242,246,255,.84);
  --on-pos:#000; --on-neg:#000;
  --rad:0px; --blur:none; --fill:transparent; --bord:1px solid var(--l11);
  --shade:0 1px 14px rgba(0,0,0,.95), 0 0 34px rgba(0,0,0,.78);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
.skin-glass{
  --c1:#45f0d2; --c2:#ffc46b; --c3:#8a7bff; --c4:#ff6ba8; --c5:#6bc9ff; --c6:#b8ff6b;
  --pos:#45f0d2; --neg:#ff6ba8; --gol:#8a7bff;
  --on-pos:#04140f; --on-neg:#1d0609;
  --rad:18px; --blur:blur(16px) saturate(140%);
  --fill:rgba(255,255,255,.055); --bord:1px solid rgba(255,255,255,.13);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--font);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

#art{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity .45s ease;
  background:linear-gradient(to bottom, rgba(5,7,14,.60) 0%, rgba(5,7,14,.46) 20%,
    rgba(5,7,14,.50) 64%, rgba(5,7,14,.78) 92%, rgba(5,7,14,.88) 100%),
    radial-gradient(120% 55% at 50% 44%, rgba(5,7,14,.40), transparent 72%)}
.scrim[data-off="1"]{opacity:0}

/* ---------- шапка ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:6;
  padding:calc(9px + env(safe-area-inset-top,0px)) 0 9px;
  background:rgba(5,7,14,.93);border-bottom:1px solid var(--l11);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top-in{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
.brand{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:7px;flex:none}
.ui-btn{border:1px solid var(--l50);background:transparent;color:var(--l86);border-radius:999px;
  padding:6px 12px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.ui-btn[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.rnd{width:30px;height:30px;border-radius:999px;border:1px solid var(--l50);background:transparent;
  color:var(--l86);display:grid;place-items:center;flex:none}
.rnd:active{transform:scale(.92)}

/* ---------- каркас ---------- */
.app{position:relative;z-index:3;max-width:560px;margin:0 auto;
  padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(124px + env(safe-area-inset-bottom,0px));
  transition:opacity .4s ease;text-shadow:var(--shade)}
.app[data-off="1"]{opacity:0;pointer-events:none}
.lbl{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--l50);font-weight:700}
.sh{margin:26px 0 12px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--l50);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sh button{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--l86);font-weight:700}
.empty{padding:26px 4px;color:var(--l50);font-size:13px;line-height:1.6;text-align:center}

/* ---------- бюджет ---------- */
.sum{font-size:clamp(44px,13.5vw,60px);font-weight:200;line-height:1;letter-spacing:-.05em;
  margin:8px 0 0;font-variant-numeric:tabular-nums}
.sum em{font-style:normal;font-size:.42em;font-weight:200;color:var(--l50);margin-left:.12em}
.duo{display:flex;gap:26px;margin-top:18px}
.duo div{display:flex;flex-direction:column;gap:4px}
.duo b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.d-free b{color:var(--pos)} .d-held b{color:var(--gol)}

.acc{--c:var(--ink)}
.a-n{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--l70);font-weight:500;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-n i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.acc b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}

.pane{border-radius:var(--rad);background:var(--fill);border:var(--bord);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.flows{display:flex;gap:24px}
.fl{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.fl b{font-size:19px;font-weight:400;font-variant-numeric:tabular-nums}
.fl.in b{color:var(--pos)} .fl.out b{color:var(--neg)}
.track{height:3px;background:var(--l20);overflow:hidden;margin-top:14px;border-radius:99px}
.track i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.cats{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--l70)}
.cat b{font-size:12.5px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.cat .mini{grid-column:1/-1;height:2px;background:var(--l20);overflow:hidden;margin-top:-4px;border-radius:99px}
.cat .mini i{display:block;height:100%;background:var(--neg);border-radius:99px}

.ev{--c:var(--ink)}
.gem{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:15px;
  font-weight:700;line-height:1;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);
  box-shadow:inset 0 0 16px color-mix(in srgb,var(--c) 26%,transparent);flex:none}
.ev-m{min-width:0}
.ev-m b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-m span{display:block;font-size:11px;color:var(--l50);margin-top:3px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev i{font-style:normal;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.day{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--l50);font-weight:700;
  padding:18px 2px 6px}

/* ---------- цели ---------- */
.goal{margin-bottom:10px;border-radius:var(--rad);background:var(--fill);border:var(--bord);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.g-top b{font-size:15px;font-weight:600}
.g-top span{font-size:12px;color:var(--gol);font-variant-numeric:tabular-nums}
.g-bar{height:4px;background:var(--l20);overflow:hidden;margin-top:10px;border-radius:99px}
.g-bar i{display:block;height:100%;background:var(--gol);border-radius:99px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.g-num{display:flex;justify-content:space-between;font-size:12px;color:var(--l50);margin-top:8px;
  font-variant-numeric:tabular-nums}
.g-act{display:flex;gap:7px;margin-top:12px}
.btn{flex:1;padding:10px 12px;border-radius:calc(var(--rad) - 6px);font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--l50);color:var(--ink);text-align:center}
.btn.fill{background:var(--ink);color:#000;border-color:var(--ink)}
.btn.dim{flex:0 0 42px;color:var(--neg);border-color:var(--l20)}
.btn:active{transform:scale(.97)}

/* ---------- ещё ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--l06)}
.inp{background:var(--fill);border:1px solid var(--l20);border-radius:calc(var(--rad) - 6px);
  padding:11px 12px;font-size:14px;outline:none;width:100%}
.inp:focus{border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 118px;gap:8px;align-items:center;margin-bottom:8px}
.g2 .inp:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- оформления ---------- */
.skin-mono .list{display:flex;flex-direction:column;border-top:1px solid var(--l11)}
.skin-mono .acc,.skin-mono .ev{display:flex;align-items:center;justify-content:space-between;gap:13px;
  padding:12px 0;border-bottom:1px solid var(--l06);width:100%;text-align:left;
  background:linear-gradient(90deg,rgba(5,7,14,.5),rgba(5,7,14,.26) 42%,rgba(5,7,14,.5));
  box-shadow:0 0 20px 12px rgba(5,7,14,.3)}
.skin-mono .a-n i,.skin-mono .gem{display:none}
.skin-mono .pane,.skin-mono .goal{padding:0;background:none;border:none;backdrop-filter:none}
.skin-mono .goal{padding:14px 0;border-bottom:1px solid var(--l06);margin-bottom:0}
.skin-mono .accs-rail{display:flex;flex-direction:column;border-top:1px solid var(--l11)}

.skin-glass .accs-rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 2px;
  scrollbar-width:none}
.skin-glass .accs-rail::-webkit-scrollbar{display:none}
.skin-glass .acc{flex:none;min-width:132px;border-radius:var(--rad);padding:13px 14px;
  background:var(--fill);border:var(--bord);backdrop-filter:var(--blur);
  -webkit-backdrop-filter:var(--blur);position:relative;overflow:hidden;text-align:left}
.skin-glass .acc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 58%)}
.skin-glass .a-n i{box-shadow:0 0 10px var(--c)}
.skin-glass .acc b{display:block;margin-top:7px;font-size:18px}
.skin-glass .pane,.skin-glass .goal{padding:16px}
.skin-glass .track{height:5px}
.skin-glass .track i{background:linear-gradient(90deg,var(--neg),var(--c2))}
.skin-glass .list{display:flex;flex-direction:column;gap:8px}
.skin-glass .ev{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;
  border-radius:16px;padding:11px 13px;background:var(--fill);border:var(--bord);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:100%;text-align:left}

/* ---------- низ ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;transition:opacity .4s ease;
  padding:9px 16px calc(11px + env(safe-area-inset-bottom,0px));
  background:rgba(5,7,14,.93);border-top:1px solid var(--l11);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dock[data-off="1"]{opacity:0;pointer-events:none}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;
  border-radius:calc(var(--rad) - 5px);font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.act .sgn{font-size:18px;font-weight:200;line-height:1}
.act.plus{background:var(--ink);color:#000}
.act:active{transform:scale(.975)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tabs button{text-align:center;padding:7px 2px;font-size:9px;font-weight:700;color:var(--l50);
  letter-spacing:.08em;text-transform:uppercase;border-radius:8px;border-top:1px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.skin-glass ~ .dock .act{border:none;border-radius:13px}
.skin-glass ~ .dock .act.minus{background:linear-gradient(150deg,#ff8fb8,var(--neg));
  color:var(--on-neg);box-shadow:0 6px 18px rgba(255,107,168,.3)}
.skin-glass ~ .dock .act.plus{background:linear-gradient(150deg,#7cf7e0,var(--pos));
  color:var(--on-pos);box-shadow:0 6px 18px rgba(69,240,210,.28)}
.skin-glass ~ .dock .tabs{gap:2px;padding:3px;border-radius:13px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}
.skin-glass ~ .dock .tabs button{border-top:none;border-radius:10px}
.skin-glass ~ .dock .tabs button[aria-current="page"]{background:var(--ink);color:#000}

/* ---------- панели ---------- */
.sc{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.74);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#05070e;
  border-top:1px solid var(--l50);max-height:90vh;overflow-y:auto;
  animation:rise .3s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.sheet-in{max-width:560px;margin:0 auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-head b{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.s-x{width:30px;height:30px;border:1px solid var(--l50);border-radius:999px;color:var(--l86);
  font-size:15px;line-height:1;flex:none}
.s-lbl{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--l50);font-weight:700}
.s-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,246,255,.32);
  font-weight:700;margin-top:6px}
.opt{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;width:100%;
  padding:13px 0;border-bottom:1px solid var(--l06);text-align:left;color:inherit}
.opt-t{min-width:0}
.opt-t b{display:block;font-size:14px;font-weight:600}
.opt-t span{display:block;font-size:11.5px;color:var(--l50);line-height:1.5;margin-top:3px;font-weight:500}
.mark{width:18px;height:18px;border:1px solid var(--l50);flex:none;margin-top:3px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;color:transparent}
.opt[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink);color:#000}

/* ---------- ввод ---------- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;border:1px solid var(--l20);
  border-radius:calc(var(--rad) - 4px)}
.seg button{padding:9px 3px;border-radius:calc(var(--rad) - 8px);font-size:11px;font-weight:700;
  color:var(--l50);letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:#000}
.amt-w{display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--l20);padding-bottom:8px}
.amt{flex:1;min-width:0;border:none;background:none;font-size:38px;font-weight:200;padding:0;
  outline:none;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.amt::placeholder{color:var(--l20)}
.cur{font-size:22px;color:var(--l50);font-weight:200}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:calc(var(--rad) - 8px);border:1px solid var(--l20);
  font-size:12.5px;color:var(--l70);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:8px}
.r2{display:flex;gap:8px}
</style>

</head>
<body>
<canvas id="art"></canvas>
<div class="scrim" id="scrim"></div>

<div class="top"><div class="top-in">
  <span class="brand">Ti OS</span>
  <span class="tools">
    <button class="ui-btn" id="uiBtn" aria-pressed="true">Интерфейс</button>
    <button class="rnd" id="fsBtn" aria-label="Во весь экран" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
    <button class="rnd" id="gear" aria-label="Оформление">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </span>
</div></div>

<main class="app skin-mono" id="app"></main>

<div class="dock" id="dock"><div class="dock-in">
  <div class="acts">
    <button class="act minus" id="bExp"><span class="sgn">−</span>Расход</button>
    <button class="act plus" id="bInc"><span class="sgn">+</span>Приход</button>
  </div>
  <div class="tabs">
    <button data-go="budget" aria-current="page">Бюджет</button>
    <button data-go="goals">Цели</button>
    <button data-go="history">История</button>
    <button data-go="more">Ещё</button>
  </div>
</div></div>

<div id="host"></div>

<script>
(function(){
"use strict";
const TAU = Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), uid=()=>Math.random().toString(36).slice(2,10);
const KEY = "tios.v2";

/* ===================== СОСТОЯНИЕ ===================== */
const DEF = () => ({
  accounts:[
    {id:"a1", name:"Наличные", start:0}, {id:"a2", name:"Тинькофф", start:0},
    {id:"a3", name:"Сбербанк", start:0}, {id:"a4", name:"Сейф", start:0},
    {id:"a5", name:"Крипта", start:0}
  ],
  catExp:["Продукты","Кафе и доставка","Транспорт","Жильё и ЖКХ","Связь и интернет",
          "Подписки","Здоровье","Одежда","Дом и быт","Развлечения","Подарки","Прочее"],
  catInc:["Оклад","%","Ночные смены","Подработка","Крипта","Прочее"],
  goals:[], tx:[], lastAcc:"a2", skin:"mono", art:"hole"
});
let S;
try{ const r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : null; }catch(e){}
if(!S || !S.accounts) S = DEF();
for(const k in DEF()) if(S[k] === undefined) S[k] = DEF()[k];
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const nf = new Intl.NumberFormat("ru-RU");
const nf2 = new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
function money(n, cur){
  const v = Math.round(n*100)/100;
  return (Number.isInteger(v) ? nf.format(v) : nf2.format(v)) + (cur===false?"":" ₽");
}
const esc = s => String(s==null?"":s).replace(/[<>&"]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const accName = id => (S.accounts.find(a=>a.id===id)||{}).name || "—";
const CVAR = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const accColor = id => CVAR[Math.max(0, S.accounts.findIndex(a=>a.id===id)) % CVAR.length];

function accBalance(id){
  const a = S.accounts.find(x=>x.id===id); if(!a) return 0;
  let b = a.start||0;
  for(const t of S.tx){
    if(t.type==="exp" && t.acc===id) b -= t.amount;
    else if(t.type==="inc" && t.acc===id) b += t.amount;
    else if(t.type==="trf"){ if(t.acc===id) b -= t.amount; if(t.acc2===id) b += t.amount; }
  }
  return b;
}
const total = () => S.accounts.reduce((s,a)=>s+accBalance(a.id),0);
const goalSaved = g => S.tx.reduce((s,t)=> t.goal!==g ? s : t.type==="gin" ? s+t.amount : t.type==="gout" ? s-t.amount : s, 0);
const reserved = () => S.goals.reduce((s,g)=>s+goalSaved(g.id),0);

const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dkey = s => String(s||"").slice(0,10);
function dayLabel(s){
  s = dkey(s);
  const today = iso(new Date()), y = new Date(); y.setDate(y.getDate()-1);
  if(s===today) return "Сегодня";
  if(s===iso(y)) return "Вчера";
  const d = new Date(s+"T00:00:00");
  if(isNaN(d)) return s || "—";
  return d.getDate()+" "+MON[d.getMonth()];
}
const byDate = (a,b)=> b.date===a.date ? b.id.localeCompare(a.id) : (a.date<b.date?1:-1);

/* ===================== ЭКРАНЫ ===================== */
const app = document.getElementById("app");
let screen = "budget";

function txTitle(t){
  if(t.type==="trf") return accName(t.acc)+" → "+accName(t.acc2);
  if(t.type==="gin"||t.type==="gout"){
    const g = S.goals.find(g=>g.id===t.goal);
    return (t.type==="gin"?"В цель: ":"Из цели: ") + (g?g.name:"удалена");
  }
  return t.cat || "Без категории";
}
function txColor(t){
  return t.type==="exp" ? "var(--neg)" : t.type==="inc" ? "var(--pos)"
       : t.type==="trf" ? "var(--l70)" : "var(--gol)";
}
function txSign(t){
  return t.type==="exp" ? "−" : t.type==="inc" ? "+" : t.type==="trf" ? "⇄" : t.type==="gin" ? "◆" : "◇";
}
function txAmt(t){
  const p = t.type==="exp" ? "−" : t.type==="trf" ? "" : t.type==="gout" ? "−" : "+";
  return p + money(t.amount);
}
function evRow(t){
  const sub = [t.type==="trf"?"Перевод":accName(t.acc), t.note].filter(Boolean).join(" · ");
  return `<button class="ev" style="--c:${txColor(t)}" data-tx="${t.id}">
    <span class="gem">${txSign(t)}</span>
    <span class="ev-m"><b>${esc(txTitle(t))}</b><span>${esc(sub)}</span></span>
    <i style="color:${txColor(t)}">${txAmt(t)}</i></button>`;
}

function viewBudget(){
  const tot = total(), res = reserved();
  const pre = iso(new Date()).slice(0,7);
  let inc=0, exp=0; const byCat={};
  for(const t of S.tx){
    if(!t.date.startsWith(pre)) continue;
    if(t.type==="inc") inc += t.amount;
    if(t.type==="exp"){ exp += t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; }
  }
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const mx = top.length ? top[0][1] : 1;
  const recent = [...S.tx].sort(byDate).slice(0,5);

  return `
  <span class="lbl">Всего денег</span>
  <div class="sum">${money(tot,false)}<em>₽</em></div>
  <div class="duo">
    <div class="d-free"><span class="lbl">Свободно</span><b>${money(tot-res)}</b></div>
    <div class="d-held"><span class="lbl">В целях</span><b>${money(res)}</b></div>
  </div>

  <h2 class="sh">Счета</h2>
  <div class="accs-rail">
    ${S.accounts.map(a=>`<button class="acc" style="--c:${accColor(a.id)}" data-acc="${a.id}">
      <span class="a-n"><i></i>${esc(a.name)}</span><b>${money(accBalance(a.id),false)}</b></button>`).join("")}
  </div>

  <h2 class="sh">${MONN[new Date().getMonth()]}</h2>
  <div class="pane">
    <div class="flows">
      <div class="fl in"><span class="lbl">Пришло</span><b>${money(inc,false)}</b></div>
      <div class="fl out"><span class="lbl">Ушло</span><b>${money(exp,false)}</b></div>
    </div>
    <div class="track"><i style="width:${inc||exp ? Math.min(100, exp/Math.max(inc,exp,1)*100) : 0}%"></i></div>
    ${top.length ? `<div class="cats">${top.map(([c,v])=>`
      <div class="cat"><span>${esc(c)}</span><b>${money(v,false)}</b>
        <span class="mini"><i style="width:${v/mx*100}%"></i></span></div>`).join("")}</div>` : ""}
  </div>

  <h2 class="sh">Последнее</h2>
  ${recent.length ? `<div class="list">${recent.map(evRow).join("")}</div>`
    : `<div class="empty">Пока пусто.<br>Жми «Расход» или «Приход» внизу.</div>`}`;
}

function viewGoals(){
  if(!S.goals.length) return `
    <h2 class="sh">Цели<button data-new-goal>Новая</button></h2>
    <div class="empty">Целей нет.<br>Отложенное резервируется: деньги остаются на счёте,<br>но уходят из «Свободно».</div>`;
  return `<h2 class="sh">Цели<button data-new-goal>Новая</button></h2>` +
    S.goals.map(g=>{
      const s = goalSaved(g.id), pct = g.target>0 ? Math.min(100, s/g.target*100) : 0;
      return `<div class="goal">
        <div class="g-top"><b>${esc(g.name)}</b><span>${Math.round(pct)}%</span></div>
        <div class="g-bar"><i style="width:${pct}%"></i></div>
        <div class="g-num"><span>${money(s)}</span><span>из ${money(g.target)}</span></div>
        <div class="g-act">
          <button class="btn fill" data-gin="${g.id}">Отложить</button>
          <button class="btn" data-gout="${g.id}">Снять</button>
          <button class="btn dim" data-gdel="${g.id}" aria-label="Удалить">✕</button>
        </div></div>`;
    }).join("");
}

function viewHistory(){
  if(!S.tx.length) return `<h2 class="sh">История</h2><div class="empty">Операций пока нет.</div>`;
  const sorted = [...S.tx].sort(byDate);
  let html = `<h2 class="sh">История<span>${S.tx.length} оп.</span></h2>`, day = "";
  for(let i=0;i<sorted.length;i++){
    const t = sorted[i];
    if(dkey(t.date)!==day){ day = dkey(t.date); html += `<div class="day">${dayLabel(day)}</div><div class="list">`; }
    html += evRow(t);
    if(!sorted[i+1] || dkey(sorted[i+1].date)!==day) html += `</div>`;
  }
  return html;
}

function viewMore(){
  return `
  <h2 class="sh">Счета<button data-new-acc>Добавить</button></h2>
  ${S.accounts.map(a=>`<div class="g2">
    <input class="inp" data-an="${a.id}" value="${esc(a.name)}" aria-label="Название счёта">
    <input class="inp" data-ab="${a.id}" inputmode="decimal" value="${accBalance(a.id)}" aria-label="Баланс">
  </div>`).join("")}

  <h2 class="sh">Модули</h2>
  <div class="row"><span style="font-size:14px">Планировщик<br>
    <span class="lbl" style="letter-spacing:.06em">задачи и привычки</span></span>
    <span class="lbl">Скоро</span></div>

  <h2 class="sh">Данные</h2>
  <div class="empty" style="padding:0 0 12px;text-align:left">
    Всё хранится только в этом браузере. Делай экспорт перед сменой телефона.</div>
  <div class="r2">
    <button class="btn" data-exp>Экспорт</button>
    <button class="btn" data-imp>Импорт</button>
  </div>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
  <textarea class="inp" id="expBox" rows="4" hidden style="margin-top:10px;font-size:11px"></textarea>
  <div style="margin-top:22px"><button class="btn dim" data-wipe style="flex:none;width:100%">Сбросить всё</button></div>`;
}

const VIEWS = {budget:viewBudget, goals:viewGoals, history:viewHistory, more:viewMore};
function render(){
  app.className = "app skin-" + S.skin;
  app.innerHTML = VIEWS[screen]();
}
function go(name){
  screen = name;
  document.querySelectorAll("[data-go]").forEach(b=>{
    if(b.dataset.go===name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));

/* ===================== ПАНЕЛИ ===================== */
const host = document.getElementById("host");
const close = ()=>{ host.innerHTML = ""; };
function shell(inner){
  host.innerHTML = `<div class="sc" data-close></div><div class="sheet" role="dialog"><div class="sheet-in">${inner}</div></div>`;
  host.querySelectorAll("[data-close]").forEach(x=>x.addEventListener("click", close));
}
function head(title){
  return `<div class="s-head"><b>${title}</b><button class="s-x" data-close aria-label="Закрыть">✕</button></div>`;
}

/* ---- ввод операции ---- */
let d = {};
function openEntry(o){
  o = o||{};
  d = {mode:o.mode||"exp", amount:"", cat:null, acc:o.acc||S.lastAcc||S.accounts[0].id,
       acc2:null, goal:o.goal||null, note:"", date:iso(new Date())};
  drawEntry();
}
function drawEntry(){
  const m = d.mode, isG = m==="gin"||m==="gout";
  const cats = m==="exp" ? S.catExp : S.catInc;
  const T = {exp:"Расход", inc:"Приход", trf:"Перевод", gin:"В цель", gout:"Из цели"}[m];
  let b = head(T);
  if(!isG) b += `<div class="seg">
    ${[["exp","Расход"],["inc","Приход"],["trf","Перевод"],["gin","В цель"]].map(([k,n])=>
      `<button data-mode="${k}" aria-pressed="${m===k}">${n}</button>`).join("")}</div>`;
  b += `<div class="amt-w"><input class="amt" id="amt" inputmode="decimal" placeholder="0"
         value="${d.amount}" aria-label="Сумма"><span class="cur">₽</span></div>`;
  if(m==="exp"||m==="inc") b += `<div class="fld"><span class="s-lbl">Категория</span><div class="chips">
    ${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${d.cat===c}">${esc(c)}</button>`).join("")}
  </div></div>`;
  if(isG) b += S.goals.length
    ? `<div class="fld"><span class="s-lbl">Цель</span><div class="chips">
       ${S.goals.map(g=>`<button class="chip" data-goal="${g.id}" aria-pressed="${d.goal===g.id}">${esc(g.name)}</button>`).join("")}
       </div></div>`
    : `<div class="empty" style="padding:8px 0;text-align:left">Сначала создай цель на вкладке «Цели».</div>`;
  b += `<div class="fld"><span class="s-lbl">${m==="trf"?"Откуда":"Счёт"}</span><div class="chips">
    ${S.accounts.map(a=>`<button class="chip" data-a1="${a.id}" aria-pressed="${d.acc===a.id}">${esc(a.name)}</button>`).join("")}
  </div></div>`;
  if(m==="trf") b += `<div class="fld"><span class="s-lbl">Куда</span><div class="chips">
    ${S.accounts.filter(a=>a.id!==d.acc).map(a=>`<button class="chip" data-a2="${a.id}" aria-pressed="${d.acc2===a.id}">${esc(a.name)}</button>`).join("")}
  </div></div>`;
  b += `<div class="r2">
      <input class="inp" id="note" placeholder="Заметка" value="${esc(d.note)}" aria-label="Заметка">
      <input class="inp" id="date" type="date" value="${d.date}" style="flex:0 0 146px" aria-label="Дата"></div>
    <div class="r2"><button class="btn" data-close>Отмена</button>
    <button class="btn fill" id="ok">Сохранить</button></div>`;
  shell(b);

  const amt = document.getElementById("amt");
  amt.focus();
  amt.oninput = ()=>{ d.amount = amt.value.replace(",","."); };
  document.getElementById("note").oninput = e=>d.note = e.target.value;
  document.getElementById("date").onchange = e=>d.date = e.target.value || d.date;
  host.querySelectorAll("[data-mode]").forEach(x=>x.onclick=()=>{ d.mode=x.dataset.mode; d.cat=null; drawEntry(); });
  host.querySelectorAll("[data-cat]").forEach(x=>x.onclick=()=>{ d.cat=x.dataset.cat; drawEntry(); });
  host.querySelectorAll("[data-goal]").forEach(x=>x.onclick=()=>{ d.goal=x.dataset.goal; drawEntry(); });
  host.querySelectorAll("[data-a1]").forEach(x=>x.onclick=()=>{ d.acc=x.dataset.a1; if(d.acc2===d.acc) d.acc2=null; drawEntry(); });
  host.querySelectorAll("[data-a2]").forEach(x=>x.onclick=()=>{ d.acc2=x.dataset.a2; drawEntry(); });
  document.getElementById("ok").onclick = commit;
}
function flash(msg){
  const b = document.getElementById("ok"); if(!b) return;
  const old = b.textContent;
  b.textContent = msg; b.style.background = "var(--neg)"; b.style.borderColor = "var(--neg)";
  setTimeout(()=>{ b.textContent = old; b.style.background=""; b.style.borderColor=""; }, 1400);
}
function commit(){
  const amount = Math.abs(parseFloat(d.amount));
  if(!amount || !isFinite(amount)) return flash("Введи сумму");
  const m = d.mode;
  if((m==="exp"||m==="inc") && !d.cat) return flash("Выбери категорию");
  if(m==="trf" && !d.acc2) return flash("Куда переводим?");
  if(isGoalMode(m) && !d.goal) return flash("Выбери цель");
  if(m==="gout" && amount > goalSaved(d.goal)) return flash("В цели только "+money(goalSaved(d.goal)));
  S.tx.push({id:uid(), type:m, amount, cat:d.cat||null, acc:d.acc, acc2:d.acc2||null,
             goal:d.goal||null, note:d.note.trim(), date:d.date});
  S.lastAcc = d.acc; save(); close(); render();
}
const isGoalMode = m => m==="gin" || m==="gout";

/* ---- карточка операции ---- */
function openTx(id){
  const t = S.tx.find(x=>x.id===id); if(!t) return;
  const rows = [
    ["Тип", {exp:"Расход",inc:"Приход",trf:"Перевод",gin:"В цель",gout:"Из цели"}[t.type]],
    ["Сумма", money(t.amount)],
    t.cat ? ["Категория", t.cat] : null,
    ["Счёт", t.type==="trf" ? accName(t.acc)+" → "+accName(t.acc2) : accName(t.acc)],
    ["Дата", dayLabel(t.date)],
    t.note ? ["Заметка", t.note] : null
  ].filter(Boolean);
  shell(head(txTitle(t)) +
    rows.map(([k,v])=>`<div class="row"><span class="s-lbl">${k}</span>
      <span style="font-size:14px;text-align:right">${esc(v)}</span></div>`).join("") +
    `<div class="r2"><button class="btn" data-close>Закрыть</button>
     <button class="btn dim" id="del" style="flex:1">Удалить</button></div>`);
  document.getElementById("del").onclick = ()=>{
    S.tx = S.tx.filter(x=>x.id!==id); save(); close(); render();
  };
}
function confirmSheet(title, text, yes){
  shell(head(title) + `<div class="empty" style="text-align:left;padding:0">${esc(text)}</div>
    <div class="r2"><button class="btn" data-close>Отмена</button>
    <button class="btn dim" id="y" style="flex:1">Удалить</button></div>`);
  document.getElementById("y").onclick = ()=>{ yes(); close(); };
}

/* ---- оформление ---- */
const SKINS = {
  mono:{n:"Моно", d:"Чёрно-белое: тонкие линии, графика на первом плане."},
  glass:{n:"Стекло", d:"Цветные стеклянные карточки, у каждого счёта свой цвет."}
};
function openLook(){
  const row=(k,n,c,on,at)=>`<button class="opt" ${at}="${k}" aria-pressed="${on}">
    <span class="opt-t"><b>${n}</b><span>${c}</span></span><span class="mark">✓</span></button>`;
  shell(head("Оформление") +
    `<div><span class="s-lbl">Вид</span>
      ${Object.keys(SKINS).map(k=>row(k,SKINS[k].n,SKINS[k].d,k===S.skin,"data-skin")).join("")}</div>
     <div><span class="s-lbl">Фон</span>
      <div class="s-sub">Чёрно-белые</div>
      ${MONO.map(k=>row(k,NAMES[k],CAPS[k],k===S.art,"data-art")).join("")}
      <div class="s-sub">Цветные</div>
      ${COLOR.map(k=>row(k,NAMES[k],CAPS[k],k===S.art,"data-art")).join("")}</div>`);
  host.querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{
    S.skin = b.dataset.skin; save(); render();
    host.querySelectorAll("[data-skin]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.skin===S.skin)));
  });
  host.querySelectorAll("[data-art]").forEach(b=>b.onclick=()=>{
    setArt(b.dataset.art);
    host.querySelectorAll("[data-art]").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.art===S.art)));
  });
}

/* ===================== КЛИКИ ===================== */
document.addEventListener("click", e=>{
  const el = t => e.target.closest(t);
  let x;
  if((x=el("[data-tx]"))) return openTx(x.dataset.tx);
  if((x=el("[data-acc]"))) return openEntry({acc:x.dataset.acc});
  if((x=el("[data-gin]"))) return openEntry({mode:"gin", goal:x.dataset.gin});
  if((x=el("[data-gout]"))) return openEntry({mode:"gout", goal:x.dataset.gout});
  if((x=el("[data-gdel]"))) return confirmSheet("Удалить цель?","Записи об откладывании тоже удалятся.",()=>{
    S.goals = S.goals.filter(g=>g.id!==x.dataset.gdel);
    S.tx = S.tx.filter(t=>t.goal!==x.dataset.gdel); save(); render();
  });
  if(el("[data-new-goal]")) return newGoal();
  if(el("[data-new-acc]")) return newAcc();
  if(el("[data-exp]")){
    const box = document.getElementById("expBox");
    box.hidden = false; box.value = JSON.stringify(S); box.focus(); box.select();
    try{ navigator.clipboard.writeText(box.value); }catch(err){}
    return;
  }
  if(el("[data-imp]")) return document.getElementById("impFile").click();
  if(el("[data-wipe]")) return confirmSheet("Сбросить всё?","Счета, операции и цели исчезнут без возврата.",()=>{
    const keep = {skin:S.skin, art:S.art};
    S = Object.assign(DEF(), keep); save(); render();
  });
});
document.addEventListener("change", e=>{
  if(e.target.id === "impFile"){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ const p = JSON.parse(r.result);
      if(p && p.accounts && p.tx){ S = p; for(const k in DEF()) if(S[k]===undefined) S[k]=DEF()[k];
        save(); setArt(S.art); render(); } }catch(err){} };
    r.readAsText(f); return;
  }
  const n = e.target.dataset.an, b = e.target.dataset.ab;
  if(n){ const a = S.accounts.find(x=>x.id===n);
    if(a && e.target.value.trim()){ a.name = e.target.value.trim(); save(); } }
  if(b){ const a = S.accounts.find(x=>x.id===b), v = parseFloat(String(e.target.value).replace(",","."));
    if(a && isFinite(v)){ a.start += v - accBalance(a.id); save(); } }
});
function newGoal(){
  shell(head("Новая цель") +
    `<div class="fld"><span class="s-lbl">Название</span>
      <input class="inp" id="gn" placeholder="Отпуск" aria-label="Название"></div>
     <div class="fld"><span class="s-lbl">Сколько нужно</span>
      <input class="inp" id="gt" inputmode="decimal" placeholder="100000" aria-label="Сумма"></div>
     <div class="r2"><button class="btn" data-close>Отмена</button>
     <button class="btn fill" id="gs">Создать</button></div>`);
  document.getElementById("gn").focus();
  document.getElementById("gs").onclick = ()=>{
    const name = document.getElementById("gn").value.trim(); if(!name) return;
    S.goals.push({id:uid(), name, target: parseFloat(document.getElementById("gt").value.replace(",","."))||0});
    save(); close(); render();
  };
}
function newAcc(){
  shell(head("Новый счёт") +
    `<div class="fld"><span class="s-lbl">Название</span>
      <input class="inp" id="an" placeholder="Альфа" aria-label="Название"></div>
     <div class="fld"><span class="s-lbl">Текущий баланс</span>
      <input class="inp" id="ab" inputmode="decimal" placeholder="0" aria-label="Баланс"></div>

function size(){
  W = innerWidth; H = innerHeight;

  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap = "round";
  off.width = Math.max(1, Math.round(W/5)); off.height = Math.max(1, Math.round(H/5));
  ART[S.art].setup();
}
function loop(){ t += 0.0075; ART[S.art].draw(); raf = requestAnimationFrame(loop); }
function still(){ for(let i=0;i<160;i++){ t+=0.0075; ART[S.art].draw(); } }
function setArt(k){
  if(!ART[k]) return;
  S.art = k; save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#05070e"; ctx.fillRect(0,0,W,H);
  ART[S.art].setup();
  if(reduce) still();
}

size();
addEventListener("resize", size);
if(reduce) still();
else{
  raf = requestAnimationFrame(loop);
  document.addEventListener("visibilitychange", ()=>{
    cancelAnimationFrame(raf);
    if(!document.hidden) raf = requestAnimationFrame(loop);

}

const root = document.documentElement, fsBtn = document.getElementById("fsBtn");
const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
if(reqFS){
  fsBtn.hidden = false;
  fsBtn.onclick = ()=>{
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement) exitFS.call(document);
      else{ const p = reqFS.call(root); if(p && p.catch) p.catch(()=>{}); }
    }catch(e){}
  };
}

render();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
})();
</script>

</body>
</html>
